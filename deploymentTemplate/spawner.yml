apiVersion: apps/v1
kind: Deployment
metadata:
  name: MAKEFILE_SERVICE_NAME-spawner
spec:
  selector:
    matchLabels:
      app: MAKEFILE_SERVICE_NAME-spawner
  template:
    metadata:
      labels:
        app: MAKEFILE_SERVICE_NAME-spawner
    spec:
      serviceAccountName: MAKEFILE_SERVICE_NAME-serviceaccount
      containers:
      - name: MAKEFILE_SERVICE_NAME-spawner
        imagePullPolicy: Never
        image: MAKEFILE_SERVICE_NAME/pods-api:MAKEFILE_TAG
        #command: ["sleep", "2000000"]
        resources:
          requests:
            cpu: ".4"
            memory: ".4G"
          limits:
            cpu: "3"
            memory: "3G"
        env:
        - name: PODS_COMPONENT
          value: spawner
        - name: DEBUG_SLEEP_LOOP
          value: 'false'
        - name: SERVICE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tapis-MAKEFILE_SERVICE_NAME-secrets
              key: service-password
        - name: POSTGRES_USERNAME
          value: pods-admin
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tapis-MAKEFILE_SERVICE_NAME-secrets
              key: postgres-password
        - name: RABBITMQ_USERNAME
          value: pods-admin
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tapis-MAKEFILE_SERVICE_NAME-secrets
              key: rabbitmq-password
        volumeMounts:
        - name: MAKEFILE_SERVICE_NAME-config
          mountPath: /home/tapis/config.json
          subPath: config.json
        # spawner writes tapisvolume config_content files at pod start
        # (kubernetes_templates.py files_write_content) — same mount api.yml has.
        - name: MAKEFILE_SERVICE_NAME-nfs-vol
          mountPath: "/podsnfs"
#DEV        - name: dev-service
#DEV          mountPath: /home/tapis/service
      volumes:
      - name: MAKEFILE_SERVICE_NAME-config
        configMap:
          name: MAKEFILE_SERVICE_NAME-config
      - name: MAKEFILE_SERVICE_NAME-nfs-vol
        nfs:
          server: MAKEFILE_STATIC_NFS_IP
          path: /
#DEV      - name: dev-service
#DEV        hostPath:
#DEV          path: /pods_service/service #NOTE FOR MINIKUBE: Minikube is a vm, you have to minikube mount for hostpath to work
#DEV          type: Directory
