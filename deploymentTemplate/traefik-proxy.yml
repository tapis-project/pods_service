apiVersion: apps/v1
kind: Deployment
metadata:
  name: MAKEFILE_SERVICE_NAME-traefik
spec:
  selector:
    matchLabels:
      app: MAKEFILE_SERVICE_NAME-traefik
  template:
    metadata:
      labels:
        app: MAKEFILE_SERVICE_NAME-traefik

    spec:
      containers:
      - name: MAKEFILE_SERVICE_NAME-traefik
        image: notchristiangarcia/traefik-testing:latest
        resources:
          requests:
            cpu: ".4"
            memory: ".4G"
          limits:
            cpu: "3"
            memory: "3G"
        ports:
          - name: web
            containerPort: 80
          - name: admin
            containerPort: 8080
          - name: tcpep
            containerPort: 8000
          - name: udpep
            containerPort: 9000
        args:
        - --tracing=false
        - --api
        - --api.dashboard
        - --accesslog=true
        - --accesslog.format=json
        - --accesslog.fields.headers.defaultmode=keep
        - --accesslog.fields.headers.names.X-Tapis-User=keep
        - --accesslog.fields.headers.names.X-Tapis-Token=redact
        # Redact credential-bearing headers at the source so they never enter the
        # access-log stream (which vector ships). The access gate sets a live
        # session cookie on anonymous requests. defaultmode stays keep so useful
        # headers (User-Agent, Referer) are still captured.
        - --accesslog.fields.headers.names.Cookie=redact
        - --accesslog.fields.headers.names.Authorization=redact
        - --api.insecure=true
        #- --providers.kubernetesingress=True
        #- --providers.kubernetescrd
        #- --providers.kubernetescrd.namespaces=default
        - --tracing.instana.loglevel=DEBUG
        #- --entrypoints.web.address=:80
        #- --entrypoints.tcpep.address=:8000
        - --tracing.instana=false
        #- --configFile=/etc/traefik/traefik-conf2.yml
        #- --providers.file.filename=/etc/traefik/traefik-conf.yml
        #- --providers.file.directory=/etc/traefik/
        #- --providers.file.watch=true
        - --providers.http=true
        - --providers.http.endpoint=http://pods-api:8000/traefik-config
        volumeMounts:
        #- name: MAKEFILE_SERVICE_NAME-traefik-conf
        #  mountPath: /etc/traefik2/
        - name: certs
          mountPath: /tmp/ssl

      volumes:
      ### Not actually used, just need to be created
      #- name: MAKEFILE_SERVICE_NAME-traefik-conf
      #  configMap: 
      #    name: MAKEFILE_SERVICE_NAME-traefik-conf
      - name: certs
        secret:
          secretName: pods-certs
