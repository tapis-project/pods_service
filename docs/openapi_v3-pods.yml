          description: Agent version last reported at checkin.
        inventory_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Inventory Hash
          description: Hash of the last stored workload inventory; agents compare
            against this to skip resending unchanged inventory.
        last_checkin_ts:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Checkin Ts
          description: Time (UTC) of the last agent checkin.
        claimed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Claimed At
          description: Time (UTC) the node was claimed by an agent via join. Null
            = unclaimed.
        decommission_ts:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Decommission Ts
          description: Time (UTC) a decommission was requested. Non-null = waiting
            for the agent to remove itself; the row hard-deletes on the agent's confirmation
            or after the timeout.
        claim_token_expires:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Claim Token Expires
          description: Expiry of the outstanding single-use claim token, if any.
