            "-c", "(exec myscript.sh)"]`
        arguments:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Arguments
          description: Arguments for the Pod's command.
        environment_variables:
          additionalProperties: true
          type: object
          title: Environment Variables
          description: Environment variables to inject into k8 pod. Use `${pods:secrets:KEY}`
            to reference secret_map entries.
          default: {}
