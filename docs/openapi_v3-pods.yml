          description: Headscale/Tailscale login server this node joins. Defaults
            to the service-wide login server when unset.
        namespace:
          anyOf:
          - type: string
          - type: 'null'
          title: Namespace
          description: Advisory Kubernetes namespace for k8s-type nodes; handed to
            the agent in its join config bundle.
      additionalProperties: false
      type: object
      required:
      - node_id
      - type
      title: NewNode
      description: Object with fields that users are allowed to specify for the Node
        class.
    NewPod:
      properties:
        pod_id:
          type: string
          title: Pod Id
          description: Name of this pod.
        image:
          type: string
          title: Image
          description: Which docker image to use, must be on allowlist, check /pods/images
            for list.
          default: ''
        template:
          type: string
          title: Template
          description: Which pod template to use as base of pod fields. User set attributes
            will overwrite template fields.
          default: ''
        description:
          type: string
          title: Description
          description: Description of this pod.
          default: ''
        command:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Command
          description: Command to run in pod. ex. `["sleep", "5000"]` or `["/bin/bash",
            "-c", "(exec myscript.sh)"]`
        arguments:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Arguments
          description: Arguments for the Pod's command.
        environment_variables:
          additionalProperties: true
          type: object
          title: Environment Variables
          description: Environment variables to inject into k8 pod. Use `${pods:secrets:KEY}`
            to reference secret_map entries.
          default: {}
        secret_map:
          additionalProperties:
            type: string
          type: object
          title: Secret Map
          description: 'Map of keys to secret values. Syntax: ${secret:name} (user
            secret), ${secret:user:name} (explicit owner). Reference in environment_variables
            via ${pods:secrets:KEY}. Resolved at pod start.'
          default: {}
        healthchecks:
          anyOf:
          - $ref: '#/components/schemas/PodHealthchecks'
          - type: 'null'
          description: 'Kubernetes health probe configuration. Supports liveness,
            readiness, and startup probes with HTTP GET, exec command, or TCP socket
            actions. Example: `{"readiness": {"http_get_path": "/health", "http_get_port":
            5000}, "networking_requires_ready": true}`'
        status_requested:
          type: string
          title: Status Requested
          description: Status requested by user, `ON`, `OFF`, or `RESTART`.
          default: 'ON'
        volume_mounts:
          additionalProperties:
            anyOf:
            - $ref: '#/components/schemas/VolumeMount'
            - type: 'null'
          type: object
          title: Volume Mounts
          description: 'Volume mounts keyed by mount_path. Values are VolumeMount
            objects (see schema) or null (to remove inherited mount). Ex: {"/data":
            {"type": "tapisvolume", "source_id": "myvolume"}, "/etc/config.ini": {"type":
            "ephemeral", "config_content": "key=value"}}'
          default: {}
        time_to_stop_default:
          type: integer
          title: Time To Stop Default
          description: Default time (sec) for pod to run from instance start. -1 for
            unlimited. 12 hour default.
          default: 43200
        time_to_stop_instance:
          anyOf:
          - type: integer
          - type: 'null'
          title: Time To Stop Instance
          description: Time (sec) for pod to run from instance start. Reset each time
            instance is started. -1 for unlimited. None uses default.
        networking:
          additionalProperties:
            $ref: '#/components/schemas/models_pods__Networking'
          type: object
          title: Networking
          description: 'Networking information. `{"url_suffix": {"protocol": "http"  "tcp",
            "port": int}}`'
          default:
            default:
              protocol: http
              port: 5000
        resources:
          $ref: '#/components/schemas/models_pods__Resources'
          description: 'Pod resource management `{"cpu_limit": 3000, "mem_limit":
            3000, "cpu_request": 500, "mem_limit": 500, "gpus": 0}`'
          default: {}
        compute_queue:
          type: string
          title: Compute Queue
          description: Queue to run pod in. `default` is the default queue.
          default: default
        template_overrides:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Template Overrides
          description: 'Partial overrides for template values. Override volume_mounts
            or secret_map values without rewriting full template field. Ex: {"volume_mounts":
            {"/data": {"source_id": "my-vol"}}, "secret_map": {"DB_PASS": "${secret:mypass}"}}'
        stack_id:
          type: string
          title: Stack Id
          description: Stack this pod belongs to (references Stack.stack_id). Set
            via the join/leave endpoints, not by direct field edit.
          default: ''
        depends_on:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Depends On
          description: Same-stack pod IDs that must reach their ready_condition before
            the Stack Action Runner starts this pod. Only honored when the stack's
            restart_policy is 'ordered'.
        ready_condition:
          type: string
          title: Ready Condition
          description: 'When this pod counts as ''up'' for dependents: ''available''
            (status==AVAILABLE) or ''ready'' (readiness probe passing; requires healthchecks.readiness,
            surfaced via status_container[''ready'']).'
          default: available
      additionalProperties: false
      type: object
      required:
      - pod_id
      title: NewPod
      description: Object with fields that users are allowed to specify for the Pod
        class.
    NewRoute:
      properties:
        route_id:
          type: string
          title: Route Id
          description: "Unique route identifier \u2014 becomes the public hostname:\
            \ <route_id>.pods.<tenant-domain>."
        port:
          type: integer
          title: Port
          description: Backend port the published service listens on.
        backend_host:
          type: string
          title: Backend Host
          description: "Host/IP traefik dials for this route (an address reachable\
            \ FROM central \u2014 e.g. a tailnet IP/name, or host.minikube.internal\
            \ in dev). v0: explicit; later prefilled from the node's checkin address."
          default: ''
        description:
          type: string
          title: Description
          description: Description of the route.
          default: ''
        tapis_auth:
          type: boolean
          title: Tapis Auth
          description: If true, will require Tapis auth to access the route.
          default: false
        tapis_auth_response_headers:
          additionalProperties:
            type: string
          type: object
          title: Tapis Auth Response Headers
          description: Specification of headers to forward to the backend when using
            Tapis auth.
          default: {}
        tapis_auth_allowed_users:
          items:
            type: string
          type: array
          title: Tapis Auth Allowed Users
          description: 'List of users allowed to access the route when using Tapis
            auth. Supports literal usernames, ''*'' (all users), and permission-based
            groups: ''AUTHORIZED_READS'' (READ+), ''AUTHORIZED_USERS'' (USER+), ''AUTHORIZED_ADMINS''
            (ADMIN+, includes APPROVEDADMIN). Groups resolve against the route''s
            permissions list.'
          default:
          - AUTHORIZED_USERS
        tapis_auth_return_path:
          type: string
          title: Tapis Auth Return Path
          description: Path to redirect to after authenticating via Tapis auth.
          default: /
        tapis_auth_excluded_paths:
          items:
            type: string
          type: array
          title: Tapis Auth Excluded Paths
          description: List of PathPrefix patterns to exclude from Tapis auth (no
            forwardAuth). ex. ['/assets', '/static']
          default: []
        tapis_auth_excluded_path_regex:
          items:
            type: string
          type: array
          title: Tapis Auth Excluded Path Regex
          description: List of PathRegexp patterns to exclude from Tapis auth. ex.
            ['\\.(js|css|ico|png)$']
          default: []
      additionalProperties: false
      type: object
      required:
      - route_id
      - port
      title: NewRoute
      description: Object with fields that users are allowed to specify for the Route
        class.
    NewSecret:
      properties:
        secret_id:
          type: string
          title: Secret Id
          description: Name of the secret.
        scope:
          type: string
          title: Scope
          description: 'Scope of secret: ''user'' or ''pod'''
          default: user
        pod_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Pod Id
          description: Pod ID if scope is 'pod'
        description:
          type: string
          title: Description
          description: Description of this secret.
          default: ''
        readable:
          type: boolean
          title: Readable
          description: If True, secret value can be retrieved via GET /secrets/{id}/value.
            Pod injection always works regardless of this setting.
          default: true
        writable:
          type: boolean
          title: Writable
          description: If True, secret value can be updated via PUT or POST recreation.
            If False, secret is write-once.
          default: true
        secret_value:
          type: string
          title: Secret Value
          description: The actual secret value to store.
      additionalProperties: false
      type: object
      required:
      - secret_id
      - secret_value
      title: NewSecret
      description: Object with fields that users are allowed to specify for the Secret
        class.
    NewSnapshot:
      properties:
        snapshot_id:
          type: string
          title: Snapshot Id
          description: Name of this snapshot.
        source_volume_id:
          type: string
          title: Source Volume Id
          description: The volume_id to use as source of snapshot.
        source_volume_path:
          type: string
          title: Source Volume Path
          description: Path in source volume_id to make snapshot of
        destination_path:
          type: string
          title: Destination Path
          description: Path to copy to. Snapshots of singular files require destination_path.
          default: ''
        description:
          type: string
          title: Description
          description: Description of this snapshot.
          default: ''
        size_limit:
          type: integer
          title: Size Limit
          description: Size in MB to limit snapshot to. We'll start warning if you've
            gone past the limit.
          default: 1024
        cron:
          type: string
          title: Cron
          description: cron bits
          default: ''
        retention_policy:
          type: string
          title: Retention Policy
          description: retention_policy bits
          default: ''
      additionalProperties: false
      type: object
      required:
      - snapshot_id
      - source_volume_id
      - source_volume_path
      title: NewSnapshot
      description: Object with fields that users are allowed to specify for the Snapshot
        class.
    NewStack:
      properties:
        stack_id:
          type: string
          title: Stack Id
          description: Name of this stack. Flat and unique per tenant, like pod_id/volume_id.
        description:
          type: string
          title: Description
          description: Description of this stack.
          default: ''
        restart_policy:
          type: string
          title: Restart Policy
          description: How stack actions order member pods. 'ordered' honors each
            pod's depends_on; 'parallel' acts on all members at once.
          default: ordered
      additionalProperties: false
      type: object
      required:
      - stack_id
      title: NewStack
      description: Object with fields that users are allowed to specify for the Stack
