          description: Status requested by user, `ON`, `OFF`, or `RESTART`.
          default: 'ON'
        volume_mounts:
          additionalProperties:
            anyOf:
            - $ref: '#/components/schemas/VolumeMount'
            - type: 'null'
          type: object
          title: Volume Mounts
          description: 'Volume mounts keyed by mount_path. Values are VolumeMount
            objects (see schema) or null (to remove inherited mount). Ex: {"/data":
            {"type": "tapisvolume", "source_id": "myvolume"}, "/etc/config.ini": {"type":
            "ephemeral", "config_content": "key=value"}}'
          default: {}
        time_to_stop_default:
          type: integer
          title: Time To Stop Default
          description: Default time (sec) for pod to run from instance start. -1 for
            unlimited. 12 hour default.
          default: 43200
        time_to_stop_instance:
          anyOf:
          - type: integer
          - type: 'null'
          title: Time To Stop Instance
          description: Time (sec) for pod to run from instance start. Reset each time
            instance is started. -1 for unlimited. None uses default.
        networking:
          additionalProperties:
            $ref: '#/components/schemas/models_pods__Networking'
          type: object
          title: Networking
          description: 'Networking information. `{"url_suffix": {"protocol": "http"  "tcp",
            "port": int}}`'
          default:
            default:
              protocol: http
              port: 5000
        resources:
          $ref: '#/components/schemas/models_pods__Resources'
          description: 'Pod resource management `{"cpu_limit": 3000, "mem_limit":
            3000, "cpu_request": 500, "mem_limit": 500, "gpus": 0}`'
          default: {}
        compute_queue:
          type: string
          title: Compute Queue
          description: Queue to run pod in. `default` is the default queue.
          default: default
        template_overrides:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Template Overrides
          description: 'Partial overrides for template values. Override volume_mounts
            or secret_map values without rewriting full template field. Ex: {"volume_mounts":
            {"/data": {"source_id": "my-vol"}}, "secret_map": {"DB_PASS": "${secret:mypass}"}}'
        stack_id:
          type: string
          title: Stack Id
          description: Stack this pod belongs to (references Stack.stack_id). Set
            via the join/leave endpoints, not by direct field edit.
          default: ''
        depends_on:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Depends On
          description: Same-stack pod IDs that must reach their ready_condition before
            the Stack Action Runner starts this pod. Only honored when the stack's
            restart_policy is 'ordered'.
        ready_condition:
          type: string
          title: Ready Condition
          description: 'When this pod counts as ''up'' for dependents: ''available''
            (status==AVAILABLE) or ''ready'' (readiness probe passing; requires healthchecks.readiness,
            surfaced via status_container[''ready'']).'
          default: available
        time_to_stop_ts:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Time To Stop Ts
          description: Time (UTC) that this pod is scheduled to be stopped. Change
            with time_to_stop_instance.
        status:
          type: string
          title: Status
          description: Current status of pod.
          default: STOPPED
        status_container:
          additionalProperties: true
          type: object
          title: Status Container
          description: Status of container if exists. Gives phase. When healthchecks
            are configured, also includes 'ready' (bool) and 'restart_count' (int)
            fields.
          default: {}
        networking_live:
          type: boolean
          title: Networking Live
          description: True when Traefik is actively routing traffic to this pod's
            real service. False when pod is starting, stopped, or held behind the
            readiness gate (networking_requires_ready=True and readiness probe not
            yet passing).
          default: false
        creation_ts:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Creation Ts
          description: Time (UTC) that this pod was created.
        update_ts:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Update Ts
          description: Time (UTC) that this pod was last updated by a user action.
        last_status_check_ts:
          anyOf:
