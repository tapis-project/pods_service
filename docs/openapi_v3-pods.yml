  /pods/stacks/{stack_id}/action:
    post:
      tags:
      - Stacks
      summary: stack_action
      description: "Apply a lifecycle action to every member pod of a stack.\n\nNotes:\n\
        - action is one of 'start', 'stop', 'restart'.\n- Non-blocking: this sets\
        \ each member pod's status_requested and returns immediately. The health\n\
        \  loop's Stack Action Runner performs the ordering (respecting each pod's\
        \ depends_on/ready_condition)\n  when restart_policy is 'ordered'. To change\
        \ ordering, use PUT /pods/stacks/{stack_id}.\n- `force` (stop/restart only)\
        \ bypasses reverse-order teardown \u2014 members stop immediately, ignoring\n\
        \  dependency order during shutdown. Startup ordering is still honored.\n\
        - Requires stack ADMIN (parity with the direct per-pod stop/start/restart\
        \ routes, which\n  require pod ADMIN); the grant inherits to all members,\
        \ so no per-pod checks are needed.\n\nReturns the stack object; metadata.acted\
        \ lists the pods affected."
      operationId: stack_action
