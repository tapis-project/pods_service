          additionalProperties:
            type: string
          type: object
          title: Secret Map
          description: 'Map of keys to secret values. Syntax: ${secret:name} (user
            secret), ${secret:user:name} (explicit owner). Reference in environment_variables
            via ${pods:secrets:KEY}. Resolved at pod start.'
          default: {}
        healthchecks:
          anyOf:
          - $ref: '#/components/schemas/PodHealthchecks'
          - type: 'null'
