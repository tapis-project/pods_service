          title: Tapis Auth Response Headers
          description: Specification of headers to forward to the backend when using
            Tapis auth.
          default: {}
        tapis_auth_allowed_users:
          items:
            type: string
          type: array
          title: Tapis Auth Allowed Users
          description: 'List of users allowed to access the route when using Tapis
            auth. Supports literal usernames, ''*'' (all users), and permission-based
            groups: ''AUTHORIZED_READS'' (READ+), ''AUTHORIZED_USERS'' (USER+), ''AUTHORIZED_ADMINS''
