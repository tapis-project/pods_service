          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pods/{pod_id}/events:
    get:
      tags:
      - Pods
      summary: get_pod_events
      description: 'Get Kubernetes events for a pod.


        Returns events from the K8s event stream for this pod''s underlying container.

        Useful for diagnosing mount failures, image pull errors, OOMKilled, and container

        crash reasons that do not surface in the pods-service action_logs.


        Also returns a quick summary of which ephemeral ConfigMaps exist vs are missing.'
      operationId: get_pod_events
      parameters:
      - name: pod_id
        in: path
        required: true
        schema:
          title: Pod Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Max events to return.
          default: 50
          title: Limit
        description: Max events to return.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pods/{pod_id}/metrics:
    get:
      tags:
      - Pods
      summary: get_pod_metrics
      description: "Get live compute and traffic metrics for a pod.\n\nReturns current\
        \ CPU/memory usage from the configured metrics backend\n(`metrics_backend`\
        \ config: grafana/metrics-server/none) plus\n24-hour traffic statistics from\
        \ the traffic_logs table. When no backend is\nconfigured or the backend is\
        \ down, the `usage` field explains why \u2014\nthe request still returns 200;\
        \ traffic data is always available.\nWith `?history=true` the response also\
        \ carries `usage_history`\n({\"cpu\": [[ts, cores]...], \"mem\": [[ts, bytes]...],\
        \ window_s, step_s}) \u2014\nfiltered out of the SAME cached tenant-wide range\
        \ query the fleet\nendpoints use, so per-pod sparklines add zero metrics-backend\
        \ queries."
      operationId: get_pod_metrics
      parameters:
      - name: pod_id
        in: path
        required: true
        schema:
          title: Pod Id
      - name: history
        in: query
        required: false
        schema:
          type: boolean
          description: "Include ~1h cpu/mem time series (usage_history). Served from\
            \ the tenant-wide range cache \u2014 no extra backend load."
          default: false
          title: History
        description: "Include ~1h cpu/mem time series (usage_history). Served from\
          \ the tenant-wide range cache \u2014 no extra backend load."
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
