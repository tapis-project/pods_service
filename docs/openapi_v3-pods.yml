      description: "Delete a node (node ADMIN).\n\nPlain delete: the row + routes\
        \ + telemetry go now; the agent's token dies with\nit, and the agent on the\
        \ box parks itself within a few heartbeats (it is NOT\nremoved \u2014 the\
        \ box owner removes it, and the agent logs the exact commands).\n\n?decommission=true:\
