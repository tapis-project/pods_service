  /pods/stacks/{stack_id}/update:
    post:
      tags:
      - Stacks
      summary: update_stack_from_template
      description: "Re-derive a stack from a newer stack-template tag \u2014 the L2\
        \ *reviewed* update.\n\nWith `?dry_run=true`: returns the per-member plan\
        \ (add/remove/recreate/patch) + whether a typed\nconfirm is required, with\
        \ **no side effects**. Without dry_run: applies it \u2014 create new members,\n\
        patch or recreate changed ones, delete removed ones (gated by `confirm` ==\
        \ stack_id when the plan\nis destructive), then re-pin `from_template` to\
        \ the target tag.\n\nUser overrides on UNCHANGED fields are preserved (patch\
        \ only touches changed fields). `recreate`\nrebuilds a member from the template;\
        \ full per-field 3-way merge on recreate is a documented\nfollow-up (see tapis-ui\
        \ STACK_UPDATE_MODEL.md). Apply order is create -> patch -> remove so a\n\
        mid-apply failure never destroys data before additions succeed; re-run to\
        \ converge."
      operationId: update_stack_from_template
      parameters:
      - name: stack_id
        in: path
        required: true
        schema:
