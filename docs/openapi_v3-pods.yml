  /pods/{pod_id_net}/auth:
    get:
      tags:
      - Pods
      summary: pod_auth
      description: "Auth endpoint for each pod. When a networking object defines tapis_auth=True,\
        \ this endpoint manages auth.\n\nTraefik has a forwardAuth middleware for\
        \ http routes. This redirects users, auth happens, if traefik gets 200 then\
        \ traefik allows user to endpoint.\nAuth flow for a user getting to \"fastapi\
        \ hello world\" pod at https://fastapi.pods.tacc.tapis.io.\n  1) User navigates\
        \ to https://fastapi.pods.tacc.tapis.io\n  2) Traefik redirects user to https://tacc.tapis.io/v3/pods/fastapi/auth\n\
        \  3) Check if logged in via cookies, if logged in, respond 200 + set user\
        \ defined headers. Otherwise...\n  4) Pods service creates client in correct\
        \ tenant for user or updates client if it already exists. (we expect only\
        \ one client in use at a time)\n  5) With client the /auth endpoint redirects\
        \ users to https://tacc.tapis.io/v3/oauth2/authorize?client_id={client_id}&redirect_uri={callback_url}&response_type=code\n\
        \  6) User logs in via browser, authorizes client, redirects to callback_url\
        \ at https://tacc.tapis.io/v3/pods/fastapi/auth/callback?code=CodeHere\n \
        \ 7) Callback url exchanges code for token, gets username from token, sets\
        \ X-Tapis-Token cookies, sets response headers according to tapis_auth_response_headers\n\
        \  8) User gets redirected back to https://fastapi.pods.tacc.tapis.io/{tapis_auth_return_path},\
        \ Traefik starts forwardAuth, user at this point should be authenticated\n\
        \  9) Auth endpoint responds with 200, sets headers specified by networking\
        \ stanza, and users gets to fastapi hello world response.\n\nusers can specify:\n\
        \ - tapis_auth=True/False - Turns on auth\n - tapis_auth_response_headers\
        \ - dict[str] - headers to set on response and their values\n - tapis_auth_allowed_users\
        \ - list[str] - list of tapis users or permission-based groups allowed to\
        \ access pod.\n   Supports literal usernames, \"*\" (all authenticated users),\
        \ and special group strings:\n     AUTHORIZED_READS  -> users with READ or\
        \ higher permission on the pod\n     AUTHORIZED_USERS  -> users with USER\
        \ or higher permission on the pod (default)\n     AUTHORIZED_ADMINS -> users\
        \ with ADMIN or higher (including APPROVEDADMIN) permission on the pod\n \
        \  Groups resolve against the pod's permissions list at auth time.\n   Can\
        \ mix groups with literal usernames, e.g. [\"AUTHORIZED_ADMINS\", \"guest_user\"\
        ].\n - tapis_auth_return_path - str - uri to return to after auth, default\
        \ is \"passthrough\", which we save in cookies(?) and return to. x-forwarded-host?\n\
        \n - response headers need to be slightly modifiable to allow for different\
        \ application requirements\n - for example we have to pass username, but many\
        \ apps require @email.bit, so user must be able to append to user.\n - tapis_auth_response_headers:\
        \ {\"X-Tapis-Username\": \"<<tapisusername>>@tapis.io\", \"FROM\": \"pods\
        \ auth endpoint from <<tenant>>.<<site>>\", \"OAUTH2_USERNAME_KEY\": \"username\"\
        }"
      operationId: pod_auth
      parameters:
      - name: pod_id_net
        in: path
        required: true
        schema:
          title: Pod Id Net
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pods/{pod_id_net}/auth/callback:
    get:
      tags:
      - Pods
      summary: pod_auth_callback
      operationId: pod_auth_callback
      parameters:
      - name: pod_id_net
        in: path
        required: true
