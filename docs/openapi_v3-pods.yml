            format: date-time
          - type: 'null'
          title: Last Status Check Ts
          description: Time (UTC) of last automated health/status check.
        start_instance_ts:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start Instance Ts
          description: Time (UTC) that this pod instance was started.
        modified_fields:
          items:
            type: string
          type: array
          title: Modified Fields
          description: Fields that have been modified by the user since creation.
          default: []
