      summary: save_stack_as_template
      description: 'Snapshot a live stack into a new kind=''stack'' template tag.


        Member pod_ids become member names (the ''{stack_id}'' prefix is stripped
        where present), depends_on

        pod_ids become member names, this stack''s member k8 hostnames are reversed
        back to

        ${stack:<name>:host} references, and all concrete secret values are replaced
        with ${:?...}

        placeholders so the template embeds no real secrets (mirrors save_pod_as_template
        hygiene).


        Returns the new template tag.'
