          description: If true, will require Tapis auth to access the pod.
          default: false
        tapis_auth_response_headers:
          additionalProperties:
            type: string
          type: object
          title: Tapis Auth Response Headers
          description: Specification of headers to forward to the pod when using Tapis
            auth.
          default: {}
        tapis_auth_allowed_users:
          items:
            type: string
          type: array
          title: Tapis Auth Allowed Users
          description: 'List of users allowed to access the pod when using Tapis auth.
            Supports literal usernames, ''*'' (all users), and permission-based groups:
            ''AUTHORIZED_READS'' (READ+), ''AUTHORIZED_USERS'' (USER+), ''AUTHORIZED_ADMINS''
            (ADMIN+, includes APPROVEDADMIN). Groups resolve against the pod''s permissions
            list.'
          default:
          - AUTHORIZED_USERS
        tapis_auth_return_path:
          type: string
          title: Tapis Auth Return Path
          description: Path to redirect to when accessing the pod via Tapis auth.
          default: /
        tapis_auth_excluded_paths:
          items:
            type: string
          type: array
          title: Tapis Auth Excluded Paths
          description: List of PathPrefix patterns to exclude from Tapis auth (no
            forwardAuth). Useful for static assets that don't need auth. ex. ['/assets',
            '/static', '/_app']
          default: []
        tapis_auth_excluded_path_regex:
          items:
            type: string
          type: array
          title: Tapis Auth Excluded Path Regex
          description: List of PathRegexp patterns to exclude from Tapis auth. ex.
            ['\\.(js|css|ico|png|jpg|jpeg|webp|gif|svg|woff2?|ttf|map)$']
          default: []
        access_gate:
          type: boolean
          title: Access Gate
          description: "If true, this endpoint is gated behind a shared password/token\
            \ (the 'access gate'), so a site is not reachable on the public web until\
            \ a visitor supplies a secret. Independent of tapis_auth \u2014 visitors\
            \ do NOT need to be Tapis users. Mint credentials via POST /pods/{pod_id}/access-tokens.\
            \ Can be combined with tapis_auth (both must pass)."
          default: false
        access_gate_return_path:
          type: string
          title: Access Gate Return Path
          description: Path to redirect to after a visitor successfully redeems an
            access-gate secret.
          default: /
        cors_allow_origins:
          items:
            type: string
          type: array
          title: Cors Allow Origins
          description: List of CORS allowed origins. ex. ['https://tacc.develop.tapis.io',
            'https://tacc.tapis.io']
          default: []
        cors_allow_methods:
          items:
            type: string
          type: array
          title: Cors Allow Methods
          description: List of CORS allowed methods. ex. ['GET', 'POST', 'PUT', 'DELETE']
          default: []
        cors_allow_headers:
          items:
            type: string
          type: array
          title: Cors Allow Headers
          description: List of CORS allowed headers. ex. ['Content-Type', 'X-Tapis-Token']
          default: []
        cors_allow_credentials:
          type: boolean
          title: Cors Allow Credentials
          description: Boolean to allow credentials to be sent with CORS requests.
          default: false
        cors_max_age:
          type: integer
          title: Cors Max Age
          description: Max age of CORS preflight requests in seconds.
          default: 100
        tapis_ui_uri:
          type: string
          title: Tapis Ui Uri
          description: Path to redirect to when accessing the pod via Tapis UI.
          default: ''
        tapis_ui_uri_redirect:
          type: boolean
          title: Tapis Ui Uri Redirect
          description: If true, will redirect to the tapis_ui_uri when accessing the
            pod via Tapis UI. Otherwise, just read-only uri.
          default: false
        tapis_ui_uri_description:
          type: string
          title: Tapis Ui Uri Description
          description: Describing where the tapis_ui_uri will redirect to.
          default: ''
        proxy_compression:
          type: boolean
          title: Proxy Compression
          description: Enable Traefik compress middleware for this HTTP endpoint.
            Enabled by default for all HTTP protocol endpoints.
          default: true
        proxy_compression_encodings:
          items:
            type: string
          type: array
          title: Proxy Compression Encodings
          description: 'Ordered list of compression encodings by priority. Valid values:
            ''zstd'', ''br'', ''gzip''.'
          default:
          - zstd
          - br
          - gzip
        proxy_compression_excluded_content_types:
          items:
            type: string
          type: array
          title: Proxy Compression Excluded Content Types
          description: Content types to exclude from compression. Already-compressed
            formats (images, video, archives) are excluded automatically. Set explicit
            types here to add additional exclusions.
          default: []
        proxy_compression_min_response_body_bytes:
          type: integer
          title: Proxy Compression Min Response Body Bytes
          description: Minimum response body size in bytes before compression is applied.
            Responses smaller than this are not compressed.
          default: 1024
        custom_domain:
          type: string
          title: Custom Domain
          description: Custom domain to route to this networking entry in addition
            to the default pods URL. Must be a valid hostname. ex. 'myapp.example.com'.
            Add a CNAME record pointing your domain to pods.tacc.tapis.io, then the
            service will verify and activate routing automatically.
          default: ''
        custom_domain_verified:
          type: boolean
          title: Custom Domain Verified
          description: Set to true by the service once the CNAME for custom_domain
            is confirmed to point at the pods infrastructure. Do not set manually.
          default: false
        cert_ready:
          type: boolean
          title: Cert Ready
          description: Set to true by the service once a browser-style verifying HTTPS
            handshake to this networking url succeeds (the Let's Encrypt certificate
            is live and valid). Used by the UI to avoid sending users to a domain
            whose cert is still being issued. Do not set manually.
          default: false
        cert_state:
          type: string
          title: Cert State
          description: 'Service-managed TLS certificate provisioning state for this
            networking entry: '''' (not started), ''provisioning'' (cert being issued
            by Let''s Encrypt), ''ready'' (cert valid), or ''failed'' (still pending
            past the configured max wait). Do not set manually.'
          default: ''
        cert_provisioning_started_at:
          type: string
          title: Cert Provisioning Started At
          description: Service-managed UTC ISO timestamp of when cert provisioning
            was first observed for this entry. Used for admin cert-timing diagnostics.
            Do not set manually.
          default: ''
        cert_ready_at:
          type: string
          title: Cert Ready At
          description: Service-managed UTC ISO timestamp of when this entry's TLS
            certificate was first confirmed ready. Used for admin cert-timing diagnostics.
            Do not set manually.
          default: ''
      additionalProperties: false
      type: object
      title: Networking
