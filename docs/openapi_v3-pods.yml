    delete:
      tags:
      - Stacks
      summary: delete_stack
      description: "Delete a stack.\n\nThree modes:\n- Default: if the stack still\
        \ has member pods, returns an error listing them (nothing deleted).\n- `?force=true`:\
        \ detaches members (clears their stack_id + depends_on) then deletes the stack.\n\
        \  **Member pods are kept** \u2014 this is the safe default for cleaning up\
        \ a stack.\n- `?delete_pods=true&confirm=<stack_id>`: **destructive** \u2014\
        \ deletes the stack AND every member\n  pod (and their k8s resources). Requires\
        \ `confirm` to exactly equal the stack_id, so it cannot\n  happen by accident.\n\
        \nReturns the deleted stack_id."
      operationId: delete_stack
      parameters:
      - name: stack_id
        in: path
        required: true
        schema:
          title: Stack Id
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
