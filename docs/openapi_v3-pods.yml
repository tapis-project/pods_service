  /pods/secrets:
    get:
      tags:
      - Secrets
      summary: list_secrets
      description: 'Get all secrets you have permission to access.


        25Q4 Feature: Pods Secrets allow secure injection of credentials into pods.


        Note:

        - Returns metadata only, not secret values (use GET /secrets/{name}/value).

        - Filter shows only secrets where you have READ+ permission.


        Returns a list of secrets (without secret values).'
      operationId: list_secrets
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretsResponse'
    post:
      tags:
      - Secrets
      summary: create_secret
      description: "Create a secret with inputted information.\n\n25Q4 Feature: Pods\
        \ Secrets allow secure injection of credentials into pods.\n\nNotes:\n- This\
        \ endpoint creates new secrets only. Returns 409 Conflict if secret_id already\
        \ exists.\n- To update an existing secret, use PUT /pods/secrets/{secret_id}.\n\
        - Secrets are stored securely in Tapis Security Kernel (SK).\n- Secret names\
        \ are automatically namespaced: ``pods_{tenant}_user_{username}_{name}``\n\
        - Only initial ADMIN can use this secret in pods unless you grant permissions.\n\
        - Use ``secret_map`` in pod definitions to inject as environment variables.\n\
        - All secret operations are logged\n\nRequest Body Fields:\n- **secret_id**\
        \ (required): Alphanumeric name with underscores/dashes allowed (max 100 chars)\n\
        - **secret_value** (required): The actual secret value to store securely\n\
        - **description** (optional): ASCII description (max 500 chars)\n- **scope**\
        \ (optional): ``user`` (default) or ``pod`` - determines secret visibility\n\
        - **pod_id** (optional): Required if scope is ``pod``, must be omitted if\
        \ scope is ``user``\n- **readable** (optional): ``true`` (default) or ``false``\
        \ - controls if value can be retrieved via API\n- **writable** (optional):\
        \ ``true`` (default) or ``false`` - controls if value can be updated via PUT\n\
        \nAccess Mode Combinations:\n- ``readable=true, writable=true`` (default):\
        \ Full access - value can be read and updated\n- ``readable=true, writable=false``:\
        \ Read-only - value can be read but not updated (write-once)\n- ``readable=false,\
        \ writable=true``: Write-only - value can be updated but not read via API\n\
        - ``readable=false, writable=false``: Locked - value cannot be read or updated,\
        \ only used via pod injection\n\nNote: Pod injection via ``secret_map`` always\
        \ works regardless of ``readable`` setting.\n\nUsage in Pods:\nAfter creating\
        \ a secret, reference it in your pod's ``secret_map``; after that, reference\
        \ it with ${} in the fields that support secrets::\n\n    {\n        \"secret_map\"\
        : {\n            \"DB_PASSWORD\": \"${secret:my_db_secret}\"\n        },\n\
        \        \"environment_variables\": {\n            \"DATABASE_URL\": \"postgres://user:${pods:secrets:DB_PASSWORD}@localhost/db\"\
        \n        }\n    }\n\nReturns new secret object (without the secret value)."
      operationId: create_secret
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSecret'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pods/secrets/{secret_id}:
    get:
      tags:
      - Secrets
      summary: get_secret
      description: 'Get secret metadata (not the secret value itself).


        25Q4 Feature: Pods Secrets allow secure injection of credentials into pods.


        Note:

        - Returns metadata only. Use GET /secrets/{name}/value to retrieve the actual
        value.

        - Requires READ permission on the secret.


        Returns secret metadata.'
      operationId: get_secret
      parameters:
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          title: Secret Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Secrets
      summary: update_secret
      description: 'Update a secret''s description and/or value.


        25Q4 Feature: Pods Secrets allow secure injection of credentials into pods.


        Note:

        - Requires USER permission on the secret.

        - Secrets with ``writable=False`` cannot have their values updated (write-once
        secrets).

        - Description updates are always allowed regardless of ``writable`` setting.

        - Updates are logged.

        - Pods using this secret will get the new value on next start/restart.


        Returns updated secret metadata.'
      operationId: update_secret
      parameters:
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          title: Secret Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecret'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Secrets
      summary: delete_secret
      description: 'Delete a secret from both the database and Security Kernel (SK).


        25Q4 Feature: Pods Secrets allow secure injection of credentials into pods.


        Note:

        - Requires ADMIN permission on the secret (only the creator has this by default).

        - This operation is permanent and cannot be undone.

        - Pods currently using this secret will fail to start until the secret reference
        is removed or a new secret with the same name is created by the pod owner.

        - All delete operations are logged.


        Returns the deleted secret name.'
      operationId: delete_secret
      parameters:
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          title: Secret Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretDeleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pods/secrets/{secret_id}/value:
