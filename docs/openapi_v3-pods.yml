          type: array
          title: Metatags
          description: Metadata tags for additional search/listing functionality for
            the template.
          default: []
        archive_message:
          type: string
          title: Archive Message
          description: If set, metadata message to give users of this template.
          default: ''
      additionalProperties: false
      type: object
      required:
      - template_id
      title: NewTemplate
    NewTemplateTag:
      properties:
