              schema:
                $ref: '#/components/schemas/PodAccessTokenMintResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pods/{pod_id}/access-tokens/{token_id}:
    delete:
      tags:
      - Permissions
      summary: revoke_pod_access_token
      description: 'Revoke (permanently disable) an access-gate credential. Existing
        sessions using it

        stop working on their next gate check.'
