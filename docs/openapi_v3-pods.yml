      - name: decommission
        in: query
        required: false
        schema:
          type: boolean
          description: 'Instead of deleting immediately, ask the agent to remove itself
            first: the row enters a decommissioning state, the agent picks up a decommission
            command on its next poll, confirms, and the row hard-deletes on that confirmation
            (or after the timeout). Plain delete always works as the force path.'
          default: false
