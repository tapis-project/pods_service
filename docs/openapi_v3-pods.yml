    post:
      tags:
      - Permissions
      summary: create_pod_access_token
      description: "Mint an access-gate credential (password or shareable link). The\
        \ raw secret and a\nredemption URL are returned ONCE \u2014 they are not recoverable\
        \ afterward."
      operationId: create_pod_access_token
      parameters:
