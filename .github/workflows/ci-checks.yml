# Light PR gate for pods_service — the failing waterfall in ci/*.sh.
# Separate from build-push-all-branches.yml (that builds/ships the image; this
# gates the change first). Thin trigger only — all logic is in ci/ so it runs
# the same on Gitea act_runner (which also reads .github/workflows/) or locally
# via `bash ci/all.sh`.
name: CI Checks

on:
  pull_request:
    branches: [dev, staging, prod]
  push:
    branches: [dev, staging]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Gate 1 — syntax sweep
        run: bash ci/compile.sh

  unit:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Gate 2 — cluster-free unit tests
        run: bash ci/unit.sh

  security:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history so gitleaks + semgrep baseline work
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install scanners
        run: |
          python -m pip install --quiet semgrep pip-audit
          # gitleaks: grab the static binary (portable; pin the version)
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks || echo "gitleaks fetch failed — gate will SKIP it"
      - name: Gate 3 — deterministic security scan
        run: BASELINE=origin/${{ github.base_ref || 'dev' }} bash ci/security.sh
