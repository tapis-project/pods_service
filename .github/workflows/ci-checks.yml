# The one CI pipeline for pods_service — the failing waterfall in ci/*.sh, then
# the image build riding BEHIND the gates (absorbed from the old
# build-push-all-branches.yml, which raced this workflow in parallel and could
# publish an image for a commit whose tests failed). Thin triggers only — gate
# logic lives in ci/ so it runs the same on Gitea act_runner (which also reads
# .github/workflows/) or locally via `make ci` / `make ci-scan`.
#
# Waterfall: compile → unit + security (parallel) → build-and-push.
# PRs build the image but never publish (push:false, tag pr-<N>); real branches
# publish tapis/pods-api:<branch> (prod → latest); v* tags publish the version.
# staging/prod still carry the old build-push file until a promotion lands this
# one there — push-triggered workflows run from the pushed ref, so there is no
# breakage window, just the old unordered behavior on those branches meanwhile.
name: CI

on:
  pull_request:
    branches: [dev, staging, prod]
  push:
    branches: [dev, staging, prod]
    tags: ['v*']
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Gate 1 — syntax sweep
        run: bash ci/compile.sh

  unit:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Gate 2 — cluster-free unit tests
        run: bash ci/unit.sh

  security:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history so gitleaks + semgrep baseline work
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install scanners
        run: |
          python -m pip install --quiet semgrep pip-audit
          # gitleaks: grab the static binary (portable; pin the version)
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks || echo "gitleaks fetch failed — gate will SKIP it"
      - name: Gate 3 — deterministic security scan
        run: BASELINE=origin/${{ github.base_ref || 'dev' }} bash ci/security.sh

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: [unit, security]
    environment: docker
    steps:
      - name: Get tag or branch name for Docker tag. sed replaces 'prod' with 'latest'
        id: get_tag_name
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag_name=$(echo ${GITHUB_REF#refs/tags/v})" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # PR refs are refs/pull/<N>/merge — slashes are invalid in a docker tag
            echo "tag_name=pr-$(echo "${GITHUB_REF}" | cut -d/ -f3)" >> $GITHUB_OUTPUT
          else
            echo "tag_name=$(echo ${GITHUB_REF#refs/heads/} | sed 's/prod/latest/g')" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push tagged Docker backend image
        uses: docker/build-push-action@v3
        with:
          # PR runs build-only — the image gate is the build succeeding, nothing
          # is published until the change actually lands on a real branch.
          push: ${{ github.event_name != 'pull_request' }}
          target: final
          tags: tapis/pods-api:${{ steps.get_tag_name.outputs.tag_name }}

      - name: Build & push devtools image (dev branch only)
        # api image + requirements-dev.txt (jupyterlab, …) for in-container
        # notebook work. Layers are shared with the build above, so this step
        # only pays for the extra pip install.
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v3
        with:
          push: true
          target: devtools
          tags: tapis/pods-api:${{ steps.get_tag_name.outputs.tag_name }}-devtools
